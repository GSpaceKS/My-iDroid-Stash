name: 自动更新非GitHub项目版本

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 0 1,16 * *'
  workflow_dispatch:

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行每日更新
        run: python scripts/daily.py

      - name: 运行每半月更新
        run: python scripts/biweekly.py